<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTP Email</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        background-color: #fff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #333;
      }
      p {
        font-size: 16px;
        margin-bottom: 10px;
        color: #666;
      }
      strong {
        color: #f44336;
      }
      .otp {
        font-size: 28px;
        font-weight: bold;
        color: #2ecc71;
        margin-bottom: 20px;
      }
      .footer {
        margin-top: 30px;
        font-size: 14px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>One-Time Password (OTP)</h1>
      <p>Hello <strong>{{userName}}</strong>,</p>
      <p>We have received a request to generate an OTP for your account.</p>
      <p>Your OTP is:</p>
      <p class="otp">{{otp}}</p>
      <p class="footer">
        This OTP is valid for a limited time. Do not share it with anyone.
      </p>
    </div>
  </body>
</html>
